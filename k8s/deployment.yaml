apiVersion: apps/v1
kind: Deployment
metadata:
  name: gasmanager
  namespace: gasmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gasmanager
  template:
    metadata:
      labels:
        app: gasmanager
    spec:
      containers:
        - name: gasmanager
          image: johnbin89/gasmanager:1.0
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_CONFIG
              value: "production"
            - name: SOCKETIO_ALLOWED_ORIGINS
              value: "https://dive-calc.jbin.me,https://dir-calc.kube.jbin.me"
          envFrom:
            - secretRef:
                name: gasmanager-env
          # boot.sh runs `flask db upgrade` before gunicorn starts.
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
          # Restart only after a minute of no answers, e.g. all gunicorn threads blocked.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              # Measured: ~75Mi anon + ~7Mi slab. Rest of RSS is
              # reclaimable page cache.
              memory: 192Mi
            limits:
              # No CPU limit: single gthread worker, throttling would
              # directly stall every open websocket.
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gasmanager
  namespace: gasmanager
spec:
  selector:
    app: gasmanager
  ports:
    - port: 5000
      targetPort: 5000
