# Deletes shared plan links older than 24 hours, once a day.
# Replaces the cron daemon that used to run inside the app container (as root).
# Same image as the Deployment: the `images:` block in kustomization.yaml sets its tag too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gasmanager-delete-shared
  namespace: gasmanager
spec:
  schedule: "0 8 * * *"
  # The old in-container cron ran on the container's clock, which was UTC.
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: delete-shared
              image: johnbin89/gasmanager:1.0
              command: ["flask", "delete_shared"]
              env:
                - name: FLASK_CONFIG
                  value: "production"
              envFrom:
                - secretRef:
                    name: gasmanager-env
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
