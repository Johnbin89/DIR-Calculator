apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gasmanager

resources:
  - deployment.yaml
  - cronjob.yaml
  - httproute.yaml

# `1.0` in deployment.yaml is now only a placeholder that this block overrides.
# Bump `newTag` here, never the image line in deployment.yaml.
images:
  - name: johnbin89/gasmanager
    newTag: "155"
