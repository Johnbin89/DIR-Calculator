apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gasmanager
  namespace: gasmanager
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: dive-calc
  hostnames:
    - "dive-calc.jbin.me"
  # Only the API and live sharing; the web page at / is served by gasmanager-ui.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - name: gasmanager
          port: 5000
